services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: totem_dev
      POSTGRES_USER: totem_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Add POSTGRES_PASSWORD to totem-backoffice/.env.local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - totem_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U totem_app -d totem_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  totem_postgres_data:
